# nexus-tenants — Worker multi-tenant de tiendas Nexus 3.1
# Uso: wrangler deploy (con login o CLOUDFLARE_API_TOKEN)
# Crear el KV una vez: wrangler kv:namespace create NEXUS_TENANTS
# y pegar el id abajo. DNS wildcard *.nexuspos.com.ar -> Worker (dashboard, una vez).

name = "nexus-tenants"
main = "worker.js"
compatibility_date = "2024-01-01"

[[kv_namespaces]]
binding = "NEXUS_TENANTS"
id = "30cd0f2f30b14c15aacaa4a6c4508429"
